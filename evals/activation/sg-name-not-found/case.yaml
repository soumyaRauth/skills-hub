schema_version: '1.1'
name: sg-name-not-found
tags:
- positive
- new-skill
description: A personal portfolio whose about page is noindex and whose homepage title says Home. 'Doesn't show up' reads like a symptom for the investigator, but the request is about being found in search, and the evidence is in the pages' heads.
expected_outcome: 'Must engage: seo-growth. Must stay quiet: engineering-investigator, impact-map, dependency-guard, api-contract-guard, practical-localizer, release-engineer, delivery-lead, project-kickoff, production-guard.'
context:
  scaffold_script: scaffold.sh
execution:
  prompt: When people google my name, my site doesn't show up. Can you help?
  max_turns: 6
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
graders:
- name: engages-seo-growth
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:[\w-]+:)?(?:seo-growth)"'
- name: quiet-engineering-investigator
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:[\w-]+:)?(?:engineering-investigator)"'
  min: 0
  max: 0
- name: quiet-impact-map
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:[\w-]+:)?(?:impact-map)"'
