schema_version: '1.1'
name: passive-compass-healthy-project
tags:
- passive
- core
description: An ordinary feature in a healthy project that keeps .project-compass/. Compass may read its state; it must not speak.
expected_outcome: 'Must engage: none required. Must stay quiet: standards-compass, practical-localizer, engineering-investigator, dependency-guard, api-contract-guard.'
context:
  scaffold_script: scaffold.sh
execution:
  prompt: Add a notes field to adjustments so an approver can explain a rejection.
  max_turns: 6
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
graders:
- name: quiet-standards-compass
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:[\w-]+:)?(?:standards-compass)"'
  min: 0
  max: 0
- name: quiet-practical-localizer
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:[\w-]+:)?(?:practical-localizer)"'
  min: 0
  max: 0
- name: quiet-engineering-investigator
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:[\w-]+:)?(?:engineering-investigator)"'
  min: 0
  max: 0
- name: quiet-dependency-guard
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:[\w-]+:)?(?:dependency-guard)"'
  min: 0
  max: 0
- name: quiet-api-contract-guard
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:[\w-]+:)?(?:api-contract-guard)"'
  min: 0
  max: 0
- name: compass-silent
  type: regex
  pattern: ⚡[^\n]*Project Compass
  match: not_contains
  target: last_message
