schema_version: '1.1'
name: compose-keyboard-table
tags:
- positive
description: Accessibility implementation. Standards Compass owns it; there is no separate accessibility skill to compete.
expected_outcome: 'Must engage: standards-compass. Must stay quiet: impact-map, practical-localizer, engineering-investigator, dependency-guard, api-contract-guard, production-guard.'
context:
  scaffold_script: scaffold.sh
execution:
  prompt: Make the customer table usable with a keyboard and a screen reader.
  max_turns: 6
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
graders:
- name: engages-standards-compass
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:[\w-]+:)?(?:standards-compass)"'
- name: quiet-impact-map
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:[\w-]+:)?(?:impact-map)"'
  min: 0
  max: 0
- name: quiet-practical-localizer
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:[\w-]+:)?(?:practical-localizer)"'
  min: 0
  max: 0
- name: quiet-engineering-investigator
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:[\w-]+:)?(?:engineering-investigator)"'
  min: 0
  max: 0
- name: quiet-dependency-guard
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:[\w-]+:)?(?:dependency-guard)"'
  min: 0
  max: 0
- name: quiet-api-contract-guard
  type: tool_used
  tool: Skill
