schema_version: '1.1'
name: pb-bug-missing-records
tags:
- positive
description: A symptom with a reproducible cause. Either proving the fix or investigating first is defensible; the audit skills are not.
expected_outcome: 'Must engage: proof-driven-dev or engineering-investigator. Must stay quiet: standards-compass, practical-localizer, dependency-guard, api-contract-guard.'
context:
  scaffold_script: scaffold.sh
execution:
  prompt: Customers say some records never appear in the list. Fix it.
  max_turns: 6
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
graders:
- name: engages-proof-driven-dev-or-engineering-investigator
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:[\w-]+:)?(?:proof-driven-dev|engineering-investigator)"'
- name: quiet-standards-compass
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:[\w-]+:)?(?:standards-compass)"'
  min: 0
  max: 0
- name: quiet-practical-localizer
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:[\w-]+:)?(?:practical-localizer)"'
  min: 0
  max: 0
- name: quiet-dependency-guard
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:[\w-]+:)?(?:dependency-guard)"'
  min: 0
  max: 0
- name: quiet-api-contract-guard
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:[\w-]+:)?(?:api-contract-guard)"'
  min: 0
  max: 0
