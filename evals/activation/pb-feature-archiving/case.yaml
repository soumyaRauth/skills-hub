schema_version: '1.1'
name: pb-feature-archiving
tags:
- positive
- core
description: Meaningful behavior change with an unstated requirement (archived notes leave the default list). Nothing security-, locale- or contract-shaped.
expected_outcome: 'Must engage: proof-driven-dev. Must stay quiet: standards-compass, practical-localizer, engineering-investigator, dependency-guard, api-contract-guard, production-guard.'
context:
  scaffold_script: scaffold.sh
execution:
  prompt: Add archiving to notes.
  max_turns: 6
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
graders:
- name: engages-proof-driven-dev
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:[\w-]+:)?(?:proof-driven-dev)"'
- name: quiet-standards-compass
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:[\w-]+:)?(?:standards-compass)"'
  min: 0
  max: 0
- name: quiet-practical-localizer
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:[\w-]+:)?(?:practical-localizer)"'
  min: 0
  max: 0
- name: quiet-engineering-investigator
