schema_version: '1.1'
name: quiet-local-rename
tags:
- quiet
description: A local rename the language resolves.
expected_outcome: 'Must engage: none required. Must stay quiet: every Skills Hub skill.'
context:
  scaffold_script: scaffold.sh
execution:
  prompt: Rename the variable rec to reconciliation in src/reconcile/close.js.
  max_turns: 6
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
graders:
- name: quiet-impact-map
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:[\w-]+:)?(?:impact-map)"'
  min: 0
  max: 0
