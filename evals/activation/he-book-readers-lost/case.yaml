schema_version: '1.1'
name: he-book-readers-lost
tags:
- positive
- keyword-trap
- new-skill
description: A book, not software. 'Tell me why' is the investigator's request shape, but the symptom is readers' understanding, and the evidence is the manuscript and reader notes.
expected_outcome: 'Must engage: human-empathy. Must stay quiet: engineering-investigator, impact-map, proof-driven-dev, production-guard, standards-compass, dependency-guard, practical-localizer, project-kickoff.'
context:
  scaffold_script: scaffold.sh
execution:
  prompt: Readers of my beginner book say they get lost in chapter 3. Can you review it and tell me why?
  max_turns: 6
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
graders:
- name: engages-human-empathy
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:[\w-]+:)?(?:human-empathy)"'
- name: quiet-engineering-investigator
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:[\w-]+:)?(?:engineering-investigator)"'
