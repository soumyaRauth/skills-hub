schema_version: '1.1'
name: quiet-where-helper-goes
tags:
- quiet
- superficial-match
- new-skill
description: '"Where should this go" in a repository with real layering violations. A different answer changes one module and is trivial to undo, so it is not architectural work.'
expected_outcome: 'Must engage: none required. Must stay quiet: every Skills Hub skill.'
context:
  scaffold_script: scaffold.sh
execution:
  prompt: Add a helper that formats an order total in cents as a currency string, and use it in the order response.
  max_turns: 6
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
graders:
- name: quiet-architecture-engineer
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:[\w-]+:)?(?:architecture-engineer)"'
