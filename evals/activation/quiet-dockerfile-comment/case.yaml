schema_version: '1.1'
name: quiet-dockerfile-comment
tags:
- quiet
- keyword-trap
- new-skill
description: 'Deploy, Docker and production are all keywords here, and the change is a comment. The Dockerfile has real findings in it; they are not this request''s business.'
expected_outcome: 'Must engage: none required. Must stay quiet: every Skills Hub skill.'
context:
  scaffold_script: scaffold.sh
execution:
  prompt: Add a comment above the EXPOSE line in the Dockerfile saying which port the service listens on in production.
  max_turns: 6
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
graders:
- name: quiet-deployment-compatibility
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:[\w-]+:)?(?:deployment-compatibility)"'
  min: 0
  max: 0
