schema_version: '1.1'
name: sc-ai-summaries
tags:
- positive
description: Customer data sent to a model, output rendered to users. Dependency Guard may engage for the SDK.
expected_outcome: 'Must engage: standards-compass. Must stay quiet: practical-localizer, engineering-investigator.'
context:
  scaffold_script: scaffold.sh
execution:
  prompt: Add an AI-generated summary of each invoice using the Claude API.
  max_turns: 6
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
graders:
- name: engages-standards-compass
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:[\w-]+:)?(?:standards-compass)"'
- name: quiet-practical-localizer
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:[\w-]+:)?(?:practical-localizer)"'
  min: 0
  max: 0
- name: quiet-engineering-investigator
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:[\w-]+:)?(?:engineering-investigator)"'
  min: 0
  max: 0
