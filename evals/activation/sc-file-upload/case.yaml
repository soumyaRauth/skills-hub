schema_version: '1.1'
name: sc-file-upload
tags:
- positive
description: 'File upload: server-side type and size limits, storage outside the web root, download authorization.'
expected_outcome: 'Must engage: standards-compass. Must stay quiet: practical-localizer, engineering-investigator, project-compass.'
context:
  scaffold_script: scaffold.sh
execution:
  prompt: Let customers attach a PDF purchase order to their invoice.
  max_turns: 6
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
graders:
- name: engages-standards-compass
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:[\w-]+:)?(?:standards-compass)"'
- name: quiet-practical-localizer
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:[\w-]+:)?(?:practical-localizer)"'
  min: 0
  max: 0
- name: quiet-engineering-investigator
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:[\w-]+:)?(?:engineering-investigator)"'
  min: 0
  max: 0
- name: quiet-project-compass
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:[\w-]+:)?(?:project-compass)"'
  min: 0
  max: 0
