schema_version: '1.1'
name: re-ci-cd-setup
tags:
- positive
- new-skill
description: A tested app with a Dockerfile and no CI; the request is the pipeline itself.
expected_outcome: 'Must engage: release-engineer. Must stay quiet: practical-localizer, engineering-investigator, project-compass, api-contract-guard, impact-map.'
context:
  scaffold_script: scaffold.sh
execution:
  prompt: Set up CI/CD so every merge to main runs the tests and deploys to staging.
  max_turns: 6
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
graders:
- name: engages-release-engineer
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:[\w-]+:)?(?:release-engineer)"'
- name: quiet-practical-localizer
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:[\w-]+:)?(?:practical-localizer)"'
  min: 0
  max: 0
- name: quiet-engineering-investigator
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:[\w-]+:)?(?:engineering-investigator)"'
  min: 0
  max: 0
- name: quiet-project-compass
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:[\w-]+:)?(?:project-compass)"'
  min: 0
  max: 0
- name: quiet-api-contract-guard
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:[\w-]+:)?(?:api-contract-guard)"'
  min: 0
  max: 0
- name: quiet-impact-map
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:[\w-]+:)?(?:impact-map)"'
  min: 0
  max: 0
