schema_version: '1.1'
name: dg-add-library
tags:
- positive
- new-skill
description: A new dependency for something the platform or a few lines already do.
expected_outcome: 'Must engage: dependency-guard. Must stay quiet: practical-localizer, engineering-investigator, project-compass.'
context:
  scaffold_script: scaffold.sh
execution:
  prompt: Add lodash so we can debounce the customer search box.
  max_turns: 6
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
graders:
- name: engages-dependency-guard
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:[\w-]+:)?(?:dependency-guard)"'
- name: quiet-practical-localizer
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:[\w-]+:)?(?:practical-localizer)"'
  min: 0
  max: 0
- name: quiet-engineering-investigator
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:[\w-]+:)?(?:engineering-investigator)"'
  min: 0
  max: 0
- name: quiet-project-compass
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:[\w-]+:)?(?:project-compass)"'
  min: 0
  max: 0
