schema_version: '1.1'
name: ob-launch-monitoring
tags:
- positive
- new-skill
description: An app about to launch with console.log logging, no health endpoint and no error tracking.
expected_outcome: 'Must engage: observability-baseline. Must stay quiet: practical-localizer, impact-map, api-contract-guard, project-compass.'
context:
  scaffold_script: scaffold.sh
execution:
  prompt: We launch next week. How will we know if something breaks in production?
  max_turns: 6
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
graders:
- name: engages-observability-baseline
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:[\w-]+:)?(?:observability-baseline)"'
- name: quiet-practical-localizer
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:[\w-]+:)?(?:practical-localizer)"'
  min: 0
  max: 0
- name: quiet-impact-map
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:[\w-]+:)?(?:impact-map)"'
  min: 0
  max: 0
- name: quiet-api-contract-guard
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:[\w-]+:)?(?:api-contract-guard)"'
  min: 0
  max: 0
- name: quiet-project-compass
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:[\w-]+:)?(?:project-compass)"'
  min: 0
  max: 0
