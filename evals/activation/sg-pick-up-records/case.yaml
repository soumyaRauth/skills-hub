schema_version: '1.1'
name: sg-pick-up-records
tags:
- contextual
- new-skill
description: Two sites with .seo-growth/ records from earlier sessions, two approvals pending and an experiment due. 'Pick up where we left off' is also Delivery Lead's request shape, but there is no .delivery/ here, and the records are SEO records.
expected_outcome: 'Must engage: seo-growth. Must stay quiet: delivery-lead, skills-pipeline, project-kickoff, impact-map, engineering-investigator, dependency-guard, practical-localizer.'
context:
  scaffold_script: scaffold.sh
execution:
  prompt: Pick up where we left off on my site's search traffic.
  max_turns: 6
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
graders:
- name: engages-seo-growth
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:[\w-]+:)?(?:seo-growth)"'
- name: quiet-delivery-lead
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:[\w-]+:)?(?:delivery-lead)"'
  min: 0
  max: 0
- name: quiet-skills-pipeline
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:[\w-]+:)?(?:skills-pipeline)"'
  min: 0
  max: 0
- name: quiet-project-kickoff
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:[\w-]+:)?(?:project-kickoff)"'
  min: 0
  max: 0
- name: quiet-impact-map
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:[\w-]+:)?(?:impact-map)"'
  min: 0
  max: 0
- name: quiet-engineering-investigator
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:[\w-]+:)?(?:engineering-investigator)"'
  min: 0
  max: 0
- name: quiet-dependency-guard
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:[\w-]+:)?(?:dependency-guard)"'
  min: 0
  max: 0
- name: quiet-practical-localizer
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:[\w-]+:)?(?:practical-localizer)"'
  min: 0
  max: 0
