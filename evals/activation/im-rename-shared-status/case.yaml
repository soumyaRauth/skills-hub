schema_version: '1.1'
name: im-rename-shared-status
tags:
- positive
- core
description: The stored value is read by raw SQL, a nightly job and two UI comparisons that share no symbol with the enum.
expected_outcome: 'Must engage: impact-map. Must stay quiet: standards-compass, practical-localizer, engineering-investigator, dependency-guard.'
context:
  scaffold_script: scaffold.sh
execution:
  prompt: Rename the COMPLETED enrollment status to APPROVED.
  max_turns: 6
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
graders:
- name: engages-impact-map
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:[\w-]+:)?(?:impact-map)"'
- name: quiet-standards-compass
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:[\w-]+:)?(?:standards-compass)"'
  min: 0
  max: 0
- name: quiet-practical-localizer
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:[\w-]+:)?(?:practical-localizer)"'
  min: 0
  max: 0
- name: quiet-engineering-investigator
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:[\w-]+:)?(?:engineering-investigator)"'
  min: 0
  max: 0
- name: quiet-dependency-guard
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:[\w-]+:)?(?:dependency-guard)"'
  min: 0
  max: 0
