schema_version: '1.1'
name: dc-deploy-to-vps
tags:
- positive
- new-skill
description: A named target environment with a supplied specification. The project needs Node 22, Redis and a worker; the spec offers Node 20, no Redis and one service.
expected_outcome: 'Must engage: deployment-compatibility. Must stay quiet: practical-localizer, engineering-investigator, project-compass, api-contract-guard.'
context:
  scaffold_script: scaffold.sh
execution:
  prompt: Get this app ready to deploy on my Ubuntu VPS — the server details are in server-spec.md.
  max_turns: 6
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
graders:
- name: engages-deployment-compatibility
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:[\w-]+:)?(?:deployment-compatibility)"'
- name: quiet-practical-localizer
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:[\w-]+:)?(?:practical-localizer)"'
  min: 0
  max: 0
- name: quiet-engineering-investigator
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:[\w-]+:)?(?:engineering-investigator)"'
  min: 0
  max: 0
- name: quiet-project-compass
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:[\w-]+:)?(?:project-compass)"'
  min: 0
  max: 0
- name: quiet-api-contract-guard
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:[\w-]+:)?(?:api-contract-guard)"'
  min: 0
  max: 0
