schema_version: '1.1'
name: already-satisfied-dialog
tags:
- already-satisfied
description: Dialog.jsx already does both. Standards Compass may look; nothing should be built.
expected_outcome: 'Must engage: none required. Must stay quiet: impact-map, production-guard, dependency-guard, engineering-investigator, practical-localizer, api-contract-guard, project-compass.'
context:
  scaffold_script: scaffold.sh
execution:
  prompt: Make sure the booking dialog moves focus in and restores it on close.
  max_turns: 6
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
graders:
- name: quiet-impact-map
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:[\w-]+:)?(?:impact-map)"'
  min: 0
  max: 0
- name: quiet-production-guard
