schema_version: '1.1'
name: im-explicit-invocation
tags:
- override
description: The user named the skill. A small change, but an explicit request engages it regardless.
expected_outcome: 'Must engage: impact-map. Must stay quiet: standards-compass, practical-localizer, engineering-investigator, dependency-guard, api-contract-guard.'
context:
  scaffold_script: scaffold.sh
execution:
  prompt: 'Use Impact Map before doing this: extend the order cancellation window from 15 to 30 minutes.'
  max_turns: 6
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
graders:
- name: engages-impact-map
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:[\w-]+:)?(?:impact-map)"'
- name: quiet-standards-compass
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:[\w-]+:)?(?:standards-compass)"'
  min: 0
  max: 0
- name: quiet-practical-localizer
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:[\w-]+:)?(?:practical-localizer)"'
  min: 0
  max: 0
- name: quiet-engineering-investigator
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:[\w-]+:)?(?:engineering-investigator)"'
  min: 0
  max: 0
- name: quiet-dependency-guard
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:[\w-]+:)?(?:dependency-guard)"'
  min: 0
  max: 0
- name: quiet-api-contract-guard
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:[\w-]+:)?(?:api-contract-guard)"'
  min: 0
  max: 0
