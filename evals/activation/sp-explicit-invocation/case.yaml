schema_version: '1.1'
name: sp-explicit-invocation
tags:
- override
description: The user asked for the pipeline by name with no sequence. It shows the
  menu and waits, so no other skill may load yet.
expected_outcome: 'Must engage: skills-pipeline. Must stay quiet: every other skill,
  until a sequence is chosen.'
context:
  scaffold_script: scaffold.sh
execution:
  prompt: Run adding tags to notes through the skills pipeline.
  max_turns: 6
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
graders:
- name: engages-skills-pipeline
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:[\w-]+:)?(?:skills-pipeline)"'
- name: quiet-impact-map
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:[\w-]+:)?(?:impact-map)"'
  min: 0
  max: 0
