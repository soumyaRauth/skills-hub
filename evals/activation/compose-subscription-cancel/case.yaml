schema_version: '1.1'
name: compose-subscription-cancel
tags:
- composition
description: A billing lifecycle change touching the provider, webhooks and existing records.
expected_outcome: 'Must engage: impact-map or standards-compass or api-contract-guard. Must stay quiet: practical-localizer, engineering-investigator.'
context:
  scaffold_script: scaffold.sh
execution:
  prompt: Add subscription cancellation.
  max_turns: 6
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
graders:
- name: engages-impact-map-or-standards-compass-or-api-contract-guard
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:[\w-]+:)?(?:impact-map|standards-compass|api-contract-guard)"'
- name: quiet-practical-localizer
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:[\w-]+:)?(?:practical-localizer)"'
  min: 0
  max: 0
- name: quiet-engineering-investigator
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:[\w-]+:)?(?:engineering-investigator)"'
  min: 0
  max: 0
- name: composes-two-or-more
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:[\w-]+:)?(?:impact-map|proof-driven-dev|production-guard|practical-localizer|engineering-investigator|project-compass|standards-compass|dependency-guard|api-contract-guard)"'
  min: 2
