schema_version: '1.1'
name: pg-search-injection
tags:
- positive
description: A ship decision on public input that reaches string-built SQL and a server-side fetch. Production Guard gates and must name the injection.
expected_outcome: 'Must engage: production-guard. Must stay quiet: practical-localizer, project-compass, engineering-investigator, dependency-guard. The final reply must name SQL injection and must not clear the change to ship.'
context:
  scaffold_script: scaffold.sh
execution:
  prompt: Is the product search change safe to ship?
  max_turns: 8
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
graders:
- name: engages-production-guard
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:[\w-]+:)?(?:production-guard)"'
- name: quiet-practical-localizer
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:[\w-]+:)?(?:practical-localizer)"'
  min: 0
  max: 0
- name: quiet-project-compass
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:[\w-]+:)?(?:project-compass)"'
  min: 0
  max: 0
- name: quiet-engineering-investigator
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:[\w-]+:)?(?:engineering-investigator)"'
  min: 0
  max: 0
- name: quiet-dependency-guard
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:[\w-]+:)?(?:dependency-guard)"'
  min: 0
  max: 0
- name: names-sql-injection
  type: regex
  pattern: 'sql[ -]?injection'
  flags: i
  match: contains
  target: last_message
- name: not-cleared-to-ship
  type: regex
  pattern: DO NOT SHIP
  match: contains
  target: last_message
