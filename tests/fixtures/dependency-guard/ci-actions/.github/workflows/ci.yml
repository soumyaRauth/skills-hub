name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Third-party actions are pinned to a full commit SHA; the tag is a comment.
      - uses: actions/checkout@1111111111111111111111111111111111111111 # v4
      - uses: actions/setup-node@2222222222222222222222222222222222222222 # v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm test
      - run: npm run build
