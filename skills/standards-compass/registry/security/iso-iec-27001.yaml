id: iso-iec-27001
name: Information security management systems — Requirements
identifier: ISO/IEC 27001:2022
version: "2022"
authority: ISO
type: international-standard
category: security
status: current
official_url: https://www.iso.org/standard/27001
publication_date: "2022-10-25"
free_to_read: false
last_verified: "2026-09-07"
verification:
  method: authoritative-source
  source: https://www.iso.org/standard/27001
summary: >
  Requirements for an information security management system: context, roles,
  risk assessment and treatment, objectives, competence, operation, monitoring,
  internal audit, management review, improvement. Its Annex A control set is the
  part engineers recognize, but the certifiable object is the management system,
  not the control list.
related:
  - "ISO/IEC 27001:2022/Amd 1:2024 — climate action changes (https://www.iso.org/standard/88435.html)"
  - "ISO/IEC 27002:2022 — implementation guidance for the Annex A controls"
applies_when:
  - organization_claims_or_pursues_isms
  - enterprise_customers_require_it
  - handles_confidential_customer_data
applicability_notes: >
  Applicability is organizational, not technical. A repository never "is" or
  "is not" 27001 — an organization holds a certificate for a defined scope, and
  the software inside that scope contributes evidence for a subset of Annex A.
  Mark it POTENTIALLY APPLICABLE unless the user states an ISMS exists or is
  being pursued, and say what determines it.
assessment:
  repository_evidence: limited
  automatable:
    - Technical Annex A themes visible in code — access control, cryptography,
      logging, secure development, supplier code dependencies
  manual_only:
    - Whether controls are selected on the basis of a risk assessment
  external_only:
    - The management system itself — scope, policy, risk treatment, audit,
      management review, competence, physical and people controls
controls:
  - authorization
  - authentication
  - cryptography
  - secrets-management
  - logging
  - monitoring
  - data-protection
  - backup-recovery
  - change-management
  - incident-response
  - supply-chain
  - lifecycle-process
claim_boundary: >
  Never state or imply certification, conformance, or "ISO 27001 compliant" from
  a repository. The defensible phrasing is "repository evidence relevant to
  ISO/IEC 27001 Annex A themes", with the organizational controls listed as
  outside the assessment.
not_indicated_when: >
  A personal project, a prototype, or any context with no organizational ISMS
  claim and no customer requirement for one.
